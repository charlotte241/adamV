name: Update dashboard data

on:
  schedule:
    - cron: '23 5,11,17,23 * * *'   # four times a day (UTC)
  workflow_dispatch:                 # manual "Run workflow" button

permissions:
  contents: write

# Only one refresh at a time. Two overlapping runs both try to push to main
# and the slower one is rejected, which is what produced the failure emails.
concurrency:
  group: rpm-update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5

      - name: Fetch orders from Eventbrite
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
        run: python3 scripts/fetch_data.py

      - name: Fetch weekly plan from monday.com
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python3 scripts/fetch_plan.py

      - name: Add any ticket buyer missing from the board
        env:
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python3 scripts/add_new_people.py

      - name: Sync attendance onto the CRM board
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python3 scripts/sync_crm.py

      - name: Fill in what we know about each person
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python3 scripts/enrich_crm.py

      - name: Fill the per-event grid
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python3 scripts/fill_event_grid.py

      - name: Flag duplicate people on the CRM board
        env:
          MONDAY_TOKEN: ${{ secrets.MONDAY_TOKEN }}
        run: python3 scripts/dedupe_crm.py

      - name: Commit if changed
        run: |
          git config user.name "rpm-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git add plan.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing changed - nothing to push"
            exit 0
          fi
          git commit -m "Data refresh $(date -u '+%Y-%m-%d %H:%M')"
          # The run takes 15-50 minutes, so main has often moved on by now
          # (a Pages build, a web edit, or another run). Rebase onto whatever
          # is there and try again rather than failing and emailing Charlotte.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push attempt $attempt was rejected - retrying in 15s"
            sleep 15
          done
          echo "::warning::Data refresh could not be pushed after 5 attempts. The board was still updated; only data.json is stale."
          exit 0
